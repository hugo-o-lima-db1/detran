name: Verificar vagas DETRAN-PR

# ⚠️ ATENÇÃO: o agendamento automático está DESLIGADO de propósito.
#
# Motivo (comprovado por diagnóstico nas execuções deste workflow): o portal do
# Detran-PR carrega seu aplicativo JavaScript do host
#   dagf-detran-atendimento-prod.paas.pr.gov.br
# e esse host NÃO responde a partir dos servidores do GitHub (EUA):
#   Portal .......: http=200 em 0,7s
#   API ..........: http=200 em 0,5s
#   Bundle JS ....: timeout total (40s), 0 bytes
# Sem o bundle, a página abre em branco e não existe campo de CPF para preencher.
#
# ➜ Para rodar 24/7, use uma VPS NO BRASIL: veja deploy/instalar-vps.sh
#
# Este workflow segue disponível para execução MANUAL (útil para re-testar se o
# Detran mudar a hospedagem). Se um dia o bundle passar a responder daqui, basta
# descomentar o bloco "schedule" abaixo.
on:
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch: {} # botão "Run workflow" na aba Actions

# Nunca deixa duas execuções rodarem ao mesmo tempo.
concurrency:
  group: detran-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Os secrets DETRAN_CPF/DETRAN_PROCESSO estão salvos no Environment "detran"
    # (Settings → Environments). Vincular o job a esse ambiente torna esses
    # secrets disponíveis para os passos abaixo.
    environment: detran
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Diagnóstico de rede (o runner alcança o Detran-PR?)
        # Não derruba o job; só reporta se o site responde deste servidor.
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          echo "== Portal =="
          curl -sS -A "$UA" -m 40 -o /dev/null \
            -w 'http=%{http_code} tempo=%{time_total}s tamanho=%{size_download}B\n' \
            "https://www.agendamento.detran.pr.gov.br/detran-agendamento/portal?servico=749" \
            || echo "FALHOU ao acessar o portal"
          echo "== API =="
          curl -sS -A "$UA" -m 40 -o /dev/null \
            -w 'http=%{http_code} tempo=%{time_total}s\n' \
            -H 'X-App-Route: 23479:0' \
            "https://ws.agendamento.detran.pr.gov.br/detran-agendamento/api/agendamento/fase/inicio?f_servico_pre_selecionado=749" \
            || echo "FALHOU ao acessar a API"
          echo "== Bundle JS do portal (host da aplicacao) =="
          # Se ESTE host falhar, a pagina abre em branco e nada funciona.
          curl -sS -A "$UA" -m 40 -o /dev/null \
            -w 'http=%{http_code} tempo=%{time_total}s tamanho=%{size_download}B\n' \
            -H 'Referer: https://www.detran.pr.gov.br/' \
            "https://dagf-detran-atendimento-prod.paas.pr.gov.br/assets/index-cc095a18.js" \
            || echo "FALHOU ao acessar o bundle JS (provavel bloqueio geografico)"

      - name: Verificar vagas (e agendar se AUTO_BOOK=true)
        env:
          DETRAN_CPF: ${{ secrets.DETRAN_CPF }}
          DETRAN_PROCESSO: ${{ secrets.DETRAN_PROCESSO }}
          DETRAN_SERVICO: '749'
          # O acesso é só com CPF + processo, então o Actions consegue agendar
          # sozinho. Deixe 'true' para agendar automaticamente.
          AUTO_BOOK: ${{ vars.AUTO_BOOK || 'true' }}
          HEADLESS: 'true'
          CIDADE_PREFERIDA: ${{ vars.CIDADE_PREFERIDA }}
          DATA_MINIMA: ${{ vars.DATA_MINIMA }}
          DATA_MAXIMA: ${{ vars.DATA_MAXIMA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        # Código de saída 1 = "sem vaga hoje": não deve marcar o job como falho.
        # Códigos 0 (agendou/achou) e 2 (erro) seguem o comportamento normal.
        run: npm run check || [ "$?" -eq 1 ]

      - name: Guardar evidências (screenshots/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          retention-days: 7
          if-no-files-found: ignore
